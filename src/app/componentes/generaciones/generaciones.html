<div class="container">
    <div class="menu" *ngIf=generaciones>
        <p class="menu-label">{{ numeroDeGeneraciones }} Las diferentes generaciones:</p>

        <ul class="menu-list" *ngFor="let generacion of generaciones">
            <li>
                <a href="#">{{ generacion.name | titlecase }}</a>
            </li>
        </ul>
    </div>
</div>
