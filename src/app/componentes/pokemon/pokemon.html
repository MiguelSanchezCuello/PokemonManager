<ul class="menu-list">
<div *ngIf=pokemon>
    <img (click)=" clickEnImagen(pokemon)" src="{{ pokemon.sprites.front_default }}"  />
    <li>Nombre: {{ pokemon.name | titlecase }} </li>
    <li>Tamaño: <span *ngIf="pokemon.height; else na">{{ pokemon.height / 10 | number:'1.0-2' }} m</span></li>
    <li>Peso: <span *ngIf="pokemon.weight; else na">{{ pokemon.weight / 10 | number:'1.0-2' }} kg</span></li>
    <ng-template #na>N/A</ng-template>
</div>
</ul>
