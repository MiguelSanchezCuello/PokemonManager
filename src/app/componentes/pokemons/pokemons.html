<div class="container">
    <h2>Los seis primeros Pokemon : </h2>
    <hr />
    <div class="columns">
        <div class="column">
            <p>{{cuenta}} Pokemons en la base de datos. </p>
            <p *ngIf="pokemonSeleccionado">El pokemon seleccionado es: {{ pokemonSeleccionado.name | titlecase }}</p>
        </div>
    </div>
    
    <div *ngIf="pokemons?.length<1">Ningun Pokemon encontrado</div>

    <div class="columns is-multiline">
        <ul class="menu-list column is-one-third" *ngFor="let pokemon of pokemons">
            <li>
                <app-pokemon [pokemonInput]=pokemon 
                (eventoClickImagen)=" pokemonSeleccionado=$event"></app-pokemon>
            </li>
        </ul>
    </div>
</div>
